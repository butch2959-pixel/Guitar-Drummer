<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Guitar Drummer V2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:28px 20px 40px;text-align:center}
h1{font-size:34px;margin:8px 0 4px}.sub{color:#aaa;margin-bottom:25px}
.badge{display:inline-block;background:#262626;border:1px solid #444;border-radius:999px;padding:5px 10px;font-size:12px;color:#bbb;margin-bottom:14px}
.meter{width:220px;height:220px;border:16px solid #333;border-radius:50%;margin:10px auto 24px;display:grid;place-items:center;position:relative}
.meter:after{content:"";position:absolute;inset:-16px;border-radius:50%;border:16px solid transparent;border-top-color:#fff;transform:rotate(var(--rot,0deg))}
.bpm{font-size:42px;font-weight:700}.unit{color:#aaa}
button{width:100%;border:0;border-radius:16px;padding:18px;font-size:21px;font-weight:700;background:#fff;color:#111}
button.stop{background:#444;color:#fff}.row{display:flex;gap:8px;margin:18px 0}.style{flex:1;padding:13px 5px;font-size:15px;border-radius:12px;background:#222;color:#fff;border:1px solid #444}.style.active{background:#fff;color:#111}
label{display:block;text-align:left;color:#bbb;margin:20px 0 8px}.bar{width:100%;height:9px;background:#292929;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#fff}
.status{margin:16px 0;color:#bbb;min-height:22px}.small{font-size:13px;color:#777;line-height:1.45;margin-top:25px}
</style>
</head>
<body>
<main>
<div class="badge">VERSION 2.1</div>
<h1>Guitar Drummer</h1>
<div class="sub">Your guitar. Your rhythm. Your drummer.</div>
<div class="meter" id="meter"><div><div class="bpm" id="bpm">--</div><div class="unit">BPM</div></div></div>
<button id="listen">LISTEN</button>
<div class="status" id="status">Tap LISTEN, allow microphone access, and start playing.</div>
<div class="row">
<button class="style active" data-style="rock">Rock</button>
<button class="style" data-style="blues">Blues</button>
<button class="style" data-style="country">Country</button>
<button class="style" data-style="funk">Funk</button>
</div>
<label>Intensity: <span id="intensityText">75%</span></label>
<input id="intensity" type="range" min="0" max="100" value="75" style="width:100%">
<label>Input level</label>
<div class="bar"><div class="fill" id="level"></div></div>
<div class="small">Version 2.1 • Louder drums and improved live tempo tracking. Headphones are recommended to reduce feedback.</div>
</main>
<script src="app.js"></script>
</body>
</html>
